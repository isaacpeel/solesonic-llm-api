spring.config.import=optional:file:.env[.properties]

server.shutdown=immediate

spring.application.name=Solesonic LLM API

server.servlet.context-path=/${BASE_URI}

spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${DB_PASSWORD}

jira.api.uri=https://api.atlassian.com

document.ingestion.task.enabled=true
confluence.ingestion.task.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}

solesonic.llm.token.exchange.client-id=${MCP_CLIENT_ID}
solesonic.llm.token.exchange.client-secret=${MCP_CLIENT_SECRET}
solesonic.llm.token.exchange.endpoint=${TOKEN_ENDPOINT}

spring.ai.vectorstore.pgvector.table-name=vector_store

spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholders.DB_OWNER=${POSTGRES_USER}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

spring.ai.mcp.client.name=mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.root-change-notification=true
spring.ai.mcp.client.annotation-scanner.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.request-timeout=600s

spring.ai.mcp.client.streamable-http.connections.solesonic.url=${SOLESONIC_MCP_URI}

spring.security.oauth2.client.provider.authserver.issuer-uri=${MCP_ISSUER_URI}

spring.security.oauth2.client.registration.mcp-client.client-id=${MCP_CLIENT_ID}
spring.security.oauth2.client.registration.mcp-client.client-secret=${MCP_CLIENT_SECRET}
spring.security.oauth2.client.registration.mcp-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.mcp-client.provider=authserver

logging.level.io.modelcontextprotocol.client=INFO
logging.level.io.modelcontextprotocol.spec=INFO

logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${SPRING_PROFILES_ACTIVE:local}
logging.file.name=/var/log/solesonic-llm-api/solesonic-llm-api.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=100MB

spring.ai.chat.client.observations.log-prompt=false

solesonic.llm.bot.name=${BOT_NAME:solesonic-llm-api}

# Atlassian OAuth configuration
atlassian.oauth.token-uri=${ATLASSIAN_OAUTH_TOKEN_URI}
atlassian.oauth.client-id=${ATLASSIAN_OAUTH_CLIENT_ID}
atlassian.oauth.client-secret=${ATLASSIAN_OAUTH_CLIENT_SECRET}

# Token Broker configuration
atlassian.token.broker.cache.enabled=true
atlassian.token.broker.cache.expiry-skew-seconds=45
atlassian.token.broker.retry.jitter=true
atlassian.token.broker.required-scope=token:mint:jira
atlassian.token.broker.required-audience=token-broker

atlassian.service.account.user.id=${ATLASSIAN_TOKENS_ADMIN_KEY}

encryption.password=${ENCRYPTION_PASSWORD}
encryption.salt=${ENCRYPTION_SALT}

google.oauth.auth-uri=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.base-uri=https://oauth2.googleapis.com
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}

google.api.uri=https://gmail.googleapis.com

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.password=${REDIS_PASSWORD}
redis.stream.max-length=10000
redis.stream.read-timeout-seconds=5

redis.stream.retention-seconds=900
redis.stream.keepalive-seconds=15
redis.stream.lookup-timeout-seconds=5

solesonic.llm.embedding.max-query-chars=1500

solesonic.llm.slash-commands.cache.ttl-seconds=3600
solesonic.llm.slash-commands.cache.warmup-on-startup=true

# A2A client configuration
solesonic.a2a.timeout-seconds=300
solesonic.a2a.base-uri=${A2A_BASE_URI}

solesonic.mcp.reconnect.enabled=false

solesonic.mcp.client.max-in-memory-size=16MB

spring.ai.openai.base-url=${CHAT_OPENAI_HOST}

spring.ai.model.chat=openai
spring.ai.openai.model=${DEFAULT_CHAT_MODEL}
spring.ai.openai.chat.timeout=30m
spring.ai.openai.timeout=30m
spring.ai.openai.embedding.timeout=30m
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL}
spring.ai.vectorstore.pgvector.dimensions=1024

solesonic.llm.etl.model=${ETL_MODEL}
solesonic.llm.etl.openai.read-timeout=30m

solesonic.llm.vision.model=${VISION_MODEL}
solesonic.llm.vision.openai.read-timeout=30m
solesonic.llm.vision.max-image-bytes=5MB

solesonic.llm.uri.ingestion.read-timeout=30s
solesonic.llm.uri.ingestion.max-bytes=20MB

solesonic.llm.rag-task.openai.read-timeout=30m
solesonic.llm.tool-call.openai.read-timeout=30m


solesonic.llm.image.max-concurrent=${IMAGE_MAX_CONCURRENT}
solesonic.llm.image.admission-timeout=${IMAGE_ADMISSION_TIMEOUT}
solesonic.llm.attachment.staged-ttl=${ATTACHMENT_STAGED_TTL:PT24H}
solesonic.llm.attachment.sweep.enabled=${ATTACHMENT_SWEEP_ENABLED:false}
solesonic.llm.attachment.sweep.cron=${ATTACHMENT_SWEEP_CRON:0 0 * * * *}

solesonic.llm.attachment.document.max-size-bytes=${ATTACHMENT_DOCUMENT_MAX_SIZE_BYTES:10MB}

solesonic.llm.memory.model=${MEMORY_MODEL}
solesonic.llm.memory.openai.read-timeout=${MEMORY_READ_TIMEOUT}
solesonic.llm.memory.reflection.enabled=${MEMORY_REFLECTION_ENABLED}
solesonic.llm.memory.reflection.cron=${MEMORY_REFLECTION_CRON}
solesonic.llm.memory.reflection.idle-minutes=${MEMORY_REFLECTION_IDLE_MINUTES}
solesonic.llm.memory.reflection.batch-size=${MEMORY_REFLECTION_BATCH_SIZE}
solesonic.llm.memory.reflection.max-attempts=${MEMORY_REFLECTION_MAX_ATTEMPTS}
solesonic.llm.memory.reflection.max-transcript-characters=${MEMORY_REFLECTION_MAX_TRANSCRIPT_CHARACTERS}
solesonic.llm.memory.injection.enabled=${MEMORY_INJECTION_ENABLED}
solesonic.llm.memory.prompt-max-characters=${MEMORY_PROMPT_MAX_CHARACTERS}
solesonic.llm.memory.retrieval.mode=${MEMORY_RETRIEVAL_MODE}
solesonic.llm.memory.retrieval.top-k=${MEMORY_RETRIEVAL_TOP_K}
solesonic.llm.memory.retrieval.similarity-threshold=${MEMORY_RETRIEVAL_SIMILARITY_THRESHOLD}
solesonic.llm.memory.retrieval.query-window-messages=${MEMORY_RETRIEVAL_QUERY_WINDOW_MESSAGES}
solesonic.llm.memory.embedding.cron=${MEMORY_EMBEDDING_CRON}
solesonic.llm.memory.embedding.batch-size=${MEMORY_EMBEDDING_BATCH_SIZE}
solesonic.llm.memory.max-active-memories=${MEMORY_MAX_ACTIVE}
solesonic.llm.memory.max-memory-characters=${MEMORY_MAX_CHARACTERS}
solesonic.llm.memory.min-confidence=${MEMORY_MIN_CONFIDENCE}

solesonic.push.enabled=${PUSH_ENABLED}
solesonic.push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY}
solesonic.push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY}
solesonic.push.vapid.subject=${PUSH_VAPID_SUBJECT}
solesonic.push.allowed-endpoint-hosts=${PUSH_ALLOWED_ENDPOINT_HOSTS}
solesonic.push.connect-timeout=${PUSH_CONNECT_TIMEOUT}
solesonic.push.read-timeout=${PUSH_READ_TIMEOUT}
solesonic.push.max-attempts=${PUSH_MAX_ATTEMPTS}
solesonic.push.max-failures=${PUSH_MAX_FAILURES}
solesonic.push.elicitation-reminder-seconds=${PUSH_ELICITATION_REMINDER_SECONDS}
solesonic.push.presence.ttl-seconds=${PUSH_PRESENCE_TTL_SECONDS}
solesonic.push.presence.heartbeat-seconds=${PUSH_PRESENCE_HEARTBEAT_SECONDS}

solesonic.interest.discovery.enabled=${INTEREST_DISCOVERY_ENABLED}
solesonic.interest.discovery.cron=${INTEREST_DISCOVERY_CRON}
solesonic.interest.discovery.batch-size=${INTEREST_DISCOVERY_BATCH_SIZE}
solesonic.interest.discovery.max-attempts=${INTEREST_DISCOVERY_MAX_ATTEMPTS}
solesonic.interest.discovery.min-confidence=${INTEREST_DISCOVERY_MIN_CONFIDENCE}
solesonic.interest.offer.cooldown-days=${INTEREST_OFFER_COOLDOWN_DAYS}
solesonic.interest.offer.ttl-days=${INTEREST_OFFER_TTL_DAYS}
solesonic.interest.offer.decline-cooldown-days=${INTEREST_DECLINE_COOLDOWN_DAYS}
solesonic.interest.max-agents-per-user=${INTEREST_MAX_AGENTS_PER_USER}
solesonic.interest.news.enabled=${INTEREST_NEWS_ENABLED}
solesonic.interest.news.cron=${INTEREST_NEWS_CRON}
solesonic.interest.news.batch-size=${INTEREST_NEWS_BATCH_SIZE}
solesonic.interest.news.max-results=${INTEREST_NEWS_MAX_RESULTS}
solesonic.interest.news.extract-top=${INTEREST_NEWS_EXTRACT_TOP}
solesonic.interest.news.max-article-characters=${INTEREST_NEWS_MAX_ARTICLE_CHARACTERS}
solesonic.interest.news.max-source-characters=${INTEREST_NEWS_MAX_SOURCE_CHARACTERS}
solesonic.interest.news.max-sources-per-update=${INTEREST_NEWS_MAX_SOURCES_PER_UPDATE}
solesonic.interest.news.max-summary-characters=${INTEREST_NEWS_MAX_SUMMARY_CHARACTERS}
solesonic.interest.news.delivery-hour=${INTEREST_NEWS_DELIVERY_HOUR}
solesonic.interest.news.jitter-minutes=${INTEREST_NEWS_JITTER_MINUTES}
solesonic.interest.news.run-lease-minutes=${INTEREST_NEWS_RUN_LEASE_MINUTES}
solesonic.interest.news.max-failures=${INTEREST_NEWS_MAX_FAILURES}
solesonic.interest.news.item-retention-days=${INTEREST_NEWS_ITEM_RETENTION_DAYS}
solesonic.interest.news.manual-run-cooldown-minutes=${INTEREST_NEWS_MANUAL_RUN_COOLDOWN_MINUTES}

spring.data.web.pageable.max-page-size=100
