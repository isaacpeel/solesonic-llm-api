spring.application.name=solesonic-llm-api

server.address=0.0.0.0
server.port=8080

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.reactor.netty.http.client=INFO

logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.http.client=INFO
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=INFO
logging.level.org.apache.http=INFO

logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.chat.client.advisor=INFO
logging.level.com.zaxxer.hikari=off
logging.level.com.security.BasicAuthenticationFilter=DEBUG

spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

jira.api.auth.callback.uri=${JIRA_AUTH_CALLBACK_URI}
atlassian.oauth.token-uri=https://auth.atlassian.com
google.api.auth.callback.uri=${GOOGLE_AUTH_CALLBACK_URI}
xero.api.auth.callback.uri=${XERO_AUTH_CALLBACK_URI}

cors.allowed.origins=http://localhost:3000

solesonic.llm.chat.model=qwen2.5:7b
solesonic.llm.embedding.model=all-minilm:latest
solesonic.llm.rag-task.model=qwen2.5:7b
solesonic.llm.tool-call.model=qwen2.5:7b
solesonic.llm.retrieval.similarity-threshold.chat=0.5
solesonic.llm.retrieval.similarity-threshold.user=0.75
solesonic.llm.retrieval.similarity-threshold.global=0.75

spring.ai.vectorstore.pgvector.initialize-schema=false
