solesonic.push.vapid.private-key=9J4NY01vDBsOaGv82WhOcJmsMazA703L7burTByqRAY
solesonic.push.vapid.subject=mailto:test@example.com
solesonic.push.allowed-endpoint-hosts=fcm.googleapis.com
solesonic.push.connect-timeout=5s
solesonic.push.read-timeout=10s
solesonic.push.max-attempts=3
solesonic.push.max-failures=5
solesonic.push.elicitation-reminder-seconds=120
solesonic.push.presence.ttl-seconds=45
solesonic.push.presence.heartbeat-seconds=15
