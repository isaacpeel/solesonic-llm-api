spring.application.name=solesonic-llm-api

server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=native
server.shutdown=immediate
server.servlet.context-path=/${BASE_URI}

management.endpoints.access.default=none

spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=200000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.placeholders.DB_OWNER=${POSTGRES_USER}

spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.data.web.pageable.max-page-size=100
spring.http.codecs.max-in-memory-size=10MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}

spring.security.oauth2.client.provider.authserver.issuer-uri=${MCP_ISSUER_URI}
spring.security.oauth2.client.registration.mcp-client.client-id=${MCP_CLIENT_ID}
spring.security.oauth2.client.registration.mcp-client.client-secret=${MCP_CLIENT_SECRET}
spring.security.oauth2.client.registration.mcp-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.mcp-client.provider=authserver

solesonic.llm.token.exchange.client-id=${MCP_CLIENT_ID}
solesonic.llm.token.exchange.client-secret=${MCP_CLIENT_SECRET}
solesonic.llm.token.exchange.endpoint=${TOKEN_ENDPOINT}

encryption.password=${ENCRYPTION_PASSWORD}
encryption.salt=${ENCRYPTION_SALT}

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.root-change-notification=true
spring.ai.mcp.client.annotation-scanner.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.request-timeout=600s
spring.ai.mcp.client.streamable-http.connections.solesonic.url=${SOLESONIC_MCP_URI}

solesonic.mcp.reconnect.enabled=false
solesonic.mcp.client.max-in-memory-size=16MB

spring.ai.openai.base-url=${CHAT_OPENAI_HOST}

spring.ai.model.chat=openai
spring.ai.openai.model=${DEFAULT_CHAT_MODEL}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.model=${EMBEDDING_MODEL}

solesonic.llm.rag-task.model=${DEFAULT_CHAT_MODEL}

solesonic.llm.tool-call.model=${DEFAULT_CHAT_MODEL}

solesonic.llm.etl.model=${ETL_MODEL}
solesonic.llm.etl.openai.read-timeout=5m

solesonic.llm.vision.model=${VISION_MODEL}
solesonic.llm.vision.openai.read-timeout=5m
solesonic.llm.vision.max-image-bytes=5MB

spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.initialize-schema=false

solesonic.llm.embedding.max-query-chars=1500
solesonic.llm.retrieval.similarity-threshold.chat=0.5
solesonic.llm.retrieval.similarity-threshold.user=0.75
solesonic.llm.retrieval.similarity-threshold.global=0.75

solesonic.llm.uri.ingestion.read-timeout=30s
solesonic.llm.uri.ingestion.max-bytes=20MB

solesonic.llm.attachment.staged-ttl=${ATTACHMENT_STAGED_TTL:PT24H}
solesonic.llm.attachment.sweep.enabled=${ATTACHMENT_SWEEP_ENABLED:false}
solesonic.llm.attachment.sweep.cron=${ATTACHMENT_SWEEP_CRON:0 0 * * * *}
solesonic.llm.attachment.document.max-size-bytes=${ATTACHMENT_DOCUMENT_MAX_SIZE_BYTES:10MB}

solesonic.llm.image.max-concurrent=${IMAGE_MAX_CONCURRENT}
solesonic.llm.image.admission-timeout=${IMAGE_ADMISSION_TIMEOUT}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.password=${REDIS_PASSWORD}
redis.stream.enabled=true
redis.stream.max-length=10000
redis.stream.read-timeout-seconds=5
redis.stream.retention-seconds=900
redis.stream.keepalive-seconds=15
redis.stream.lookup-timeout-seconds=5

solesonic.llm.slash-commands.cache.ttl-seconds=3600
solesonic.llm.slash-commands.cache.warmup-on-startup=true

solesonic.a2a.timeout-seconds=300
solesonic.a2a.base-uri=${A2A_BASE_URI}

solesonic.llm.bot.name=${BOT_NAME:solesonic-llm-api}
solesonic.llm.jira.url.template=https://solesonic-llm-api.atlassian.net/browse/{key}

jira.api.uri=https://api.atlassian.com
jira.api.auth.callback.uri=${CALLBACK_HOST}

atlassian.oauth.token-uri=https://auth.atlassian.com
atlassian.oauth.client-id=${ATLASSIAN_OAUTH_CLIENT_ID}
atlassian.oauth.client-secret=${ATLASSIAN_OAUTH_CLIENT_SECRET}
atlassian.service.account.user.id=${ATLASSIAN_TOKENS_ADMIN_KEY}
atlassian.token.broker.cache.enabled=true
atlassian.token.broker.cache.expiry-skew-seconds=45
atlassian.token.broker.retry.jitter=true
atlassian.token.broker.required-scope=token:mint:jira
atlassian.token.broker.required-audience=token-broker

google.oauth.auth-uri=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.base-uri=https://oauth2.googleapis.com
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.api.uri=https://gmail.googleapis.com
google.api.auth.callback.uri=${GOOGLE_CALLBACK_HOST}

training.task.enabled=true
confluence.training.task.enabled=true

logging.file.name=/var/log/solesonic-llm-api/solesonic-llm-api.log
logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${SPRING_PROFILES_ACTIVE:prod-nginx}
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=100MB

spring.ai.chat.client.observations.log-prompt=false

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=INFO
logging.level.org.springframework.http.client=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.chat.client.advisor=INFO
logging.level.org.apache.http=INFO
logging.level.reactor.netty.http.client=INFO
logging.level.io.modelcontextprotocol.client=INFO
logging.level.io.modelcontextprotocol.spec=INFO
logging.level.com.zaxxer.hikari=off
logging.level.com.security.BasicAuthenticationFilter=INFO
logging.level.com.solesonic.security.atlassian=INFO
