services:
  redis:
    env_file:
      - .env.redis
    image: redis/redis-stack-server:latest
    container_name: solesonic-redis
    network_mode: "host"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "exec redis-server /etc/redis-stack.conf --requirepass $$REDIS_PASSWORD --bind 127.0.0.1 --protected-mode yes --maxmemory 256mb --maxmemory-policy allkeys-lru --rename-command FLUSHALL \"\" --rename-command FLUSHDB \"\" --rename-command DEBUG \"\" --appendonly yes --dir /data"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
